name: 포장재 법규 매일 점검

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 22:00 UTC = 한국 시간 오전 7시
  workflow_dispatch:        # Actions 탭에서 'Run workflow' 버튼으로 수동 실행
  push:                     # 데이터나 화면을 직접 고치면 사이트만 다시 배포
    branches: [main]
    paths: ["data/**", "site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reg-watch
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 법규 점검 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LAW_OC: ${{ secrets.LAW_OC }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/update.py
      - name: 변경 내용 저장
        run: |
          git config user.name "reg-watch-bot"
          git config user.email "reg-watch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "법규 점검 $(TZ=Asia/Seoul date +%F)"
          git push

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 사이트 파일 준비
        run: |
          mkdir -p _site/data
          cp site/index.html _site/
          cp data/*.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        
